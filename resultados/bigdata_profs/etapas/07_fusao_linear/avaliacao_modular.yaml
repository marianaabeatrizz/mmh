    - ID: taxonomia
      NOME: Taxonomia (classe e-Fisco -> classe CATMAT, LOO)
      DESCRICAO: compatibilidade de classe estimada nos vínculos, leave-one-out (aditivo, peso 0.05)
    - ID: medidas_graphrag_idf
