      DESCRICAO: cobertura de entidades, cada uma pesando seu IDF (peso 0.25)
    - ID: medidas_graphrag_idf
      NOME: Medida tipada + GraphRAG IDF
      DESCRICAO: medida convertida + cobertura IDF (aditivo)
    - ID: taxonomia
      NOME: Taxonomia (classe e-Fisco -> classe CATMAT, LOO)
      DESCRICAO: compatibilidade de classe estimada nos vínculos, leave-one-out (aditivo, peso 0.05)
    - ID: taxonomia_rotulo
      NOME: Taxonomia só por rótulo (E5)
