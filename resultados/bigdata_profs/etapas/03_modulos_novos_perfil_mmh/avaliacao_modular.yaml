    - ID: medidas_taxonomia
      NOME: Medida tipada + taxonomia
      DESCRICAO: os dois sinais somados, cada um com peso inteiro
    - ID: medidas_graphrag_taxonomia
      NOME: Medida + GraphRAG + taxonomia
      DESCRICAO: medida convertida + cobertura de entidades + compatibilidade de classe
    - ID: medidas_graphrag_idf_taxonomia
